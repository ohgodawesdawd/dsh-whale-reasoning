<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH Whale Reasoning — isolated UI fixture</title>
<style>
body{margin:0;padding:48px;background:#f4f7fc;color:#1b2e55;font:14px/1.5 'Segoe UI',sans-serif}h1{font-size:20px;margin:0 0 8px}p{margin:0 0 28px;color:#71809c}.composer{padding:22px;border-radius:22px;background:white;border:1px solid #dce4f2;max-width:740px}.draft{height:82px;color:#8190a9}.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px}.fixture-send{width:36px;height:36px;border-radius:50%;border:1px solid #4d6aa2;background:#32496e;color:#dce7ff;font-size:22px}.hint{font-size:11px;margin-top:18px}html[data-ds-dark-theme] body{background:#131925;color:#e2eaff}html[data-ds-dark-theme] .composer{background:#202938;border-color:#39435a}
</style>
<h1>鲸鱼娘 · 自适应推理强度</h1><p>独立测试界面，不连接模型，不读取真实对话。</p>
<div class="composer"><div class="draft">输入消息……</div><div class="toolbar"><div id="root"></div><button type="button" class="fixture-send" aria-label="发送">↑</button></div></div>
<div class="hint">统一模型与推理设置 · 高清 224px 大肥鱼（672px / 3×）· 原模型席位接管 · 按钮靠近发送键</div>
<script src="/react.js"></script><script src="/react-dom.js"></script>
<script>
window.__rafScheduled=0;window.__nativeRaf=window.requestAnimationFrame;window.requestAnimationFrame=function(fn){window.__rafScheduled++;return window.__nativeRaf.call(window,fn);};
window.__ModuleLoader__={load(entry){window.pluginId=entry.id;window.whalePlugin=entry.factory(name=>{if(name==='react')return React;throw Error('Unexpected module '+name);});}};
</script><script src="/plugin.js"></script>
<script>
let snapshot, mode='ok', listeners=new Set(), calls=[], locked=false, addressed=false;
function emit(){listeners.forEach(fn=>fn());}
function setModel(ids, selected='high', model='fixture-model'){
 snapshot={status:'ready',current:{provider:'fixture',model,reasoningEffort:selected},groups:[{id:'fixture',models:[{id:model,name:model,reasoning:{efforts:ids.map(id=>typeof id==='string'?{id,name:id}:id)}}]}]};emit();
}
setModel(['low','high','max']);
const directory={store:{getSnapshot:()=>snapshot,subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn);}},load:async()=>{},select(payload){
 const group=snapshot.groups.find(group=>group.id===payload.provider);const target=group?.models.find(model=>model.id===payload.model);
 const advertised=(target?.reasoning?.efforts||[]).map(x=>typeof x==='string'?x:x.id);
 calls.push({...payload,advertised});
 if(!target)return {ok:false,error:{message:'目标模型已不在目录中'}};
 if(mode==='sync-reject')return {ok:false,error:{message:'测试拒绝：此档位暂不可用'}};
 if(mode==='async-reject')return Promise.reject(Error('测试异步拒绝'));
 if(mode==='slow-reject')return new Promise(resolve=>setTimeout(()=>resolve({ok:false,error:{message:'旧请求已过期'}}),300));
 const effective=payload.reasoningEffort===undefined?target.reasoning?.defaultEffort:payload.reasoningEffort;
 snapshot={...snapshot,current:{provider:payload.provider,model:payload.model,...effective===undefined?{}:{reasoningEffort:effective}}};emit();return Promise.resolve({ok:true});
}};
const directories={directoryFor:()=>directory};const sessions={scope:()=>({}),subagentAddress:()=>addressed?{id:'child'}:undefined};
const defaultSeat={name:'conversation.input.model',priority:0,Component:()=>React.createElement('button',{className:'native-model-picker'},'原生模型选择器')};
let registrations=[defaultSeat];
const ctx={slots:{inject(_name,fn){return fn();},register(spec,Component){const entry={...spec,Component};registrations.push(entry);return()=>{registrations=registrations.filter(x=>x!==entry);};}},inject(_names,fn){fn({modelDirectories:directories,sessions});}};
whalePlugin.apply(ctx);
const reactRoot=ReactDOM.createRoot(document.getElementById('root'));
function renderSeat(){const entry=registrations.filter(x=>x.name==='conversation.input.model').sort((a,b)=>(a.priority||0)-(b.priority||0))[0];reactRoot.render(React.createElement(entry.Component,{...(entry.inject?entry.inject('fixture-session'):{}),sessionId:'fixture-session',locked}));}
renderSeat();
window.fixture={setModel,setMode(value){mode=value;},snapshot:()=>snapshot,calls,notify:emit,setEffort(id){snapshot={...snapshot,current:{...snapshot.current,reasoningEffort:id}};emit();},
 setCatalog(groups,current){snapshot={status:'ready',groups,current};emit();},setLocked(value){locked=value;renderSeat();},setAddressed(value){addressed=value;renderSeat();},
 restoreNative(){registrations=registrations.filter(x=>x===defaultSeat);renderSeat();}};
</script></html>
